[pytest]
# Default (prepend) import mode on purpose. Under --import-mode=importlib pytest
# names a test module by its path relative to rootdir, so data/tests/test_x.py
# becomes "data.tests.test_x" — which collides with the real `data` package and
# forces it to resolve as a namespace, breaking every `from data.graph import ...`.
# Test file basenames are unique across the packages, so prepend mode is safe.
# conftest.py at the root keeps the repo dir itself off sys.path.
addopts = -q
testpaths =
    data/tests
    packages/policy/tests
    packages/ml_models/tests
    packages/rag_agent/tests
    apps/api/tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
