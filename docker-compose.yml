# Veritas local dev stack: Postgres (pgvector). No Neo4j — the knowledge graph is
# an edge-list table in the same database, traversed with NetworkX (data.graph).
# `docker compose up -d`, then `python -m data.generator.run`.
services:
  postgres:
    build:
      context: ./data/docker
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: veritas
      POSTGRES_DB: veritas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
