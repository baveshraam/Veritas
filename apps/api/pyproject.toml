[project]
name = "veritas-api"
version = "0.1.0"
description = "Veritas backend — FastAPI, auth, policy enforcement, SSE, audit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
    "veritas-data",
    "veritas-policy",
    "veritas-rag-agent",
    "veritas-ml-models",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*"]
