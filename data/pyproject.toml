[project]
name = "veritas-data"
version = "0.1.0"
description = "Veritas data foundation — schemas, connections, synthetic generator, NLP wrappers"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "networkx>=3.3",       # graph algorithms; replaces Neo4j GDS
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Generator + ETL: pulled in only where the pipeline runs, not by API consumers.
generator = [
    "pandas>=2.2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "numpy>=1.26",
]
# Self-hosted embeddings (ONNX, no torch) — FIR content never leaves the network.
embeddings = ["fastembed>=0.3"]

# Layer 6, both self-hosted. Heavy (torch), so they are opt-in: an API consumer that
# only serves English text chat should not pull 2GB of translation weights.
#   translation: EN<->KN. NLLB-200 by default; IndicTrans2 when its gated weights land.
#   voice:       ASR. faster-whisper pulls its own checkpoints, incl. multilingual (kn).
translation = ["torch>=2.2", "transformers>=4.40", "sentencepiece>=0.2"]
voice = ["faster-whisper>=1.0"]

dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data*"]

# seed/ (reference CSVs + committed Census derivations) ships inside the package —
# without this, an installed copy of veritas-data (Vercel, a wheel, anywhere but
# this repo checkout) has the code but not the data it reads at import time.
[tool.setuptools.package-data]
data = ["seed/**/*"]
