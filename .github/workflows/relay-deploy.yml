# Relays the Docker image from Docker Hub to Catalyst's AppSail upload bucket.
#
# Why this exists: `catalyst deploy` for a container app uploads the image tar from the
# developer's machine. On a residential uplink that is 80+ minutes for a 4.4GB image,
# and the signed upload URL Catalyst mints expires after 30 — so a local upload can
# never finish. A GitHub runner pulls the same image from Docker Hub and uploads it
# datacenter-to-datacenter in minutes.
#
# Trigger: push a fresh signed URL (from GET /appsail/get-signature) to
# .github/relay-upload.url. The upsert callback that turns the uploaded object into a
# deployment is made locally afterwards — it is a small authenticated request.
name: relay-deploy
on:
  push:
    paths:
      - ".github/relay-upload.url"
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is the signed URL still valid?
        # A push that only MOVES this file (a branch merge into main, say) replays this
        # job with a URL that was already consumed and has since expired - a 400 after a
        # two-minute build. stsDate+stsExpiresAfter is the same expiry Stratus enforces,
        # so check it here and skip instead of failing red on a deploy nobody asked for.
        id: fresh
        run: |
          U=$(cat .github/relay-upload.url)
          D=${U##*stsDate=}; D=${D%%&*}
          T=${U##*stsExpiresAfter=}; T=${T%%&*}
          EXP=$(( D / 1000 + T ))
          if [ "$(date +%s)" -ge "$EXP" ]; then
            echo "::notice::Signed URL expired at $(date -u -d @$EXP) - skipping relay. Mint a fresh one with scripts/deploy-api.py."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the deploy image and save to tar
        if: steps.fresh.outputs.ok == 'true'
        # The runner applies Dockerfile.overlay — the published base plus THIS commit's
        # source — so a source-only change never needs a `docker push` from a developer
        # machine. The base is public, so the pull needs no credentials. See
        # Dockerfile.overlay for when the base itself must be rebuilt instead.
        #
        # Plain docker save (uncompressed layers), deliberately: the bundle creator
        # extracts uncompressed layers straight into the rootfs, so peak scratch usage is
        # exactly tar + blobs + rootfs = 3x the image. Gzip layers are WORSE there — they
        # get staged to a temp dir before an rsync into rootfs, a fourth copy. The image
        # is kept ≤1.7GB so three copies fit the ~5GB sandbox (measured empirically).
        run: |
          docker pull baveshraam/veritas-api:latest
          docker build -f Dockerfile.overlay -t baveshraam/veritas-api:deploy .
          docker run --rm --entrypoint python baveshraam/veritas-api:deploy \
            -c "import api.main, rag_agent.orchestrator, ml_models, policy, data; print('imports OK')"
          docker save baveshraam/veritas-api:deploy -o "$RUNNER_TEMP/veritas.tar"
          ls -la "$RUNNER_TEMP/veritas.tar"
      - name: Upload tar to Catalyst signed URL
        if: steps.fresh.outputs.ok == 'true'
        run: |
          URL=$(cat .github/relay-upload.url)
          curl -sS --fail-with-body -X PUT \
            -T "$RUNNER_TEMP/veritas.tar" \
            -H "Content-Type: application/octet-stream" \
            -w "\nHTTP:%{http_code} took:%{time_total}s speed:%{speed_upload}B/s\n" \
            "$URL"
